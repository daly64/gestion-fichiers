name: Compiler l'APK de débogage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GestionFichiers-debug.apk

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: GestionFichiers-debug
          path: GestionFichiers-debug.apk

      # Publication en « Release » : téléchargement direct depuis le téléphone
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: Version de test ${{ github.run_number }}
          prerelease: true
          files: GestionFichiers-debug.apk
